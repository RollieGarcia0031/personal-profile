<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracks</title>
  
  <link rel="icon" type="image/x-icon" href="/favicon.ico">

  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="../assets/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/js/components/track-option/style.css">
  <script type="module" src="./main.js" defer></script>
  <script src="../assets/js/header.js" type="module"></script>
  <script src="../assets/js/register-service-worker.js" type="module" defer></script>
</head>
<body>
  <span></span>
  <!-- @site-header -->

  <main>
    <p class="title">
      Tracks
    </p>

    <p class="description">
      Explore the complete collection of tracks from anime-style
      OSTs to OPM and classical fusion.
    </p>

    <form class="card filter-form">

      <fieldset class="search-container">
        <input type="search" placeholder="Search" aria-label="Search tracks">
      </fieldset>

      <fieldset class="view-filter">        
        <label for="sort-by">Sort by:</label>
        <div class="custom-select" id="sort-by-custom">
          <button class="select-trigger" type="button">
            <i class="bi bi-sort-alpha-down"></i>
            <span class="selected-text">Title</span>
            <i class="bi bi-chevron-down arrow"></i>
          </button>
          <div class="select-options">
            <div class="option active" data-value="title">
              <i class="bi bi-sort-alpha-down"></i> Title
            </div>
            <div class="option" data-value="date">
              <i class="bi bi-calendar-event"></i> Date
            </div>
            <div class="option" data-value="duration">
              <i class="bi bi-hourglass-split"></i> Length
            </div>
          </div>
          <input type="hidden" name="sort-by" id="sort-by" value="title">
        </div>


        <div>
          <label>
            View:
          </label>
          <div class="view-button-container">
            <button id="grid-view-btn" type="button">
              <i class="bi bi-grid-3x3-gap"></i>
            </button>

            <button id="list-view-btn" type="button">
              <i class="bi bi-list-ul"></i>
            </button>
          </div>
        </div>
      </fieldset>

    </form>
  </main>

  <!-- Contains the available tracks, generated dynamically from content/tracks.json -->
  <div id="tracks-grid"></div>


  <!-- @site-footer -->
</body>
</html>

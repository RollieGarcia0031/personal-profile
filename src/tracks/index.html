<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracks</title>

  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="../assets/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/js/components/track-option/style.css">
  <script type="module" src="./main.js" defer></script>
  <script src="../assets/js/header.js" type="module"></script>
</head>
<body>
  <span></span>
  <!-- @site-header -->

  <main>
    <p class="title">
      Tracks
    </p>

    <p class="description">
      Explore the complete collection of tracks from anime-style
      OSTs to OPM and classical fusion.
    </p>

    <form class="card filter-form">

      <fieldset class="search-container">
        <button class="search-button">
          <i class="bi bi-search"></i>
        </button>
        
        <input type="search" placeholder="Search">
      </fieldset>

      <fieldset class="view-filter">        
        <label for="sort-by">Sort by:</label>
        <select name="sort-by" id="sort-by">
          <option value="title">Title</option>
          <option value="artist">Artist</option>
          <option value="album">Album</option>
        </select>

        <label for="view-style">
          View:
        </label>
        <div class="view-button-container">
          <button id="grid-view-btn">
            <i class="bi bi-grid-3x3-gap"></i>
          </button>

          <button id="list-view-btn">
            <i class="bi bi-list-ul"></i>
          </button>
        </div>
      </fieldset>

    </form>
  </main>

  <!-- Contains the available tracks, generated dynamically from content/tracks.json -->
  <div id="tracks-grid"></div>


  <!-- @site-footer -->
</body>
</html>
